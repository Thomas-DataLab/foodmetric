name: Daily FoodMetric Snapshot & Redeploy

on:
  schedule:
    # Runs at 23:00 UTC daily (06:00 AM VN Time UTC+7)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  snapshot-and-redeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb curl_cffi pydantic

      - name: Run Discovery & Pipeline Refresh
        run: |
          python scraper/pipeline.py

      - name: Verify Export Data
        run: |
          python -c "
          import json
          with open('web/public/data/leaderboard_latest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print('Products count:', len(data.get('leaderboard', [])))
          print('Total GMV:', data.get('summary', {}).get('total_gmv_vnd'))
          print('Snapshot date:', data.get('snapshot_date'))
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/public/data/leaderboard_latest.json data/foodmetric.duckdb
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): daily snapshot refresh [skip ci]"
            git push origin master
          fi
